workflows:
  smart-ticket-build:
    name: Smart Ticket Build
    # On reste à la racine car le pubspec.yaml s'y trouve
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build IPA (iOS)
        script: |
          # On construit l'archive sans signature
          flutter build ipa --release --no-codesign --target mobile/lib/main.dart
    artifacts:
      - build/ios/archive/Runner.xcarchive # <--- On récupère l'archive au lieu de l'IPA
      - build/ios/ipa/*.ipa
